name: sanitization-full-tree

# FULL-TREE sanitization audit — the detection backstop for the diff-only PR gate.
#
# Because the PR gate (sanitization.yml) scans only a PR's own diff, a leak can in
# principle reach the default branch in a file no single PR touched: a rename, a
# merge, an out-of-band edit, or content that predates the gate. This lane
# re-scans the ENTIRE tree with both layers, fail-closed, using the canonical
# gate in cyborg-garden/swarm-map (same pin as sanitization.yml).
#
# ON-DEMAND ONLY, for now — and that is a deliberate, temporary state:
#   The deterministic layer has been verified clean across the whole tree. The
#   SEMANTIC layer has never run over the full tree here, so nobody knows yet
#   whether pre-existing content carries particulars. Turning on a nightly cron
#   before that first audit would very likely produce a recurring red that no one
#   has triaged, and a gate people learn to ignore is worse than no gate.
#
#   TO ENABLE THE NIGHTLY LANE: run this workflow manually once
#   (Actions → sanitization-full-tree → Run workflow), triage whatever the
#   semantic layer reports, then uncomment the `schedule:` block below.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '17 9 * * *'   # daily, 09:17 UTC — see note above before enabling

permissions:
  contents: read

jobs:
  sanitize-full-tree:
    # The pinned tag MUST exist in cyborg-garden/swarm-map. If it does not, this
    # job fails at 0s with no check shown on the PR, which can look green. Keep
    # this repo's sanitization check REQUIRED on main so that case blocks merges.
    uses: cyborg-garden/swarm-map/.github/workflows/sanitization-gate.yml@sanitization-gate-v1.0.0
    with:
      mode: full-tree
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
