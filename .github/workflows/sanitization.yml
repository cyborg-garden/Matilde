name: sanitization

# The sanitization gate (the Alembic gate) is CANONICAL: one script, one reusable
# workflow, both in cyborg-garden/swarm-map. This repo keeps only what is its own:
# sanitize.config.json (what a "particular" means here, which paths carry
# content) and this caller. Do not vendor the script back in — the per-repo
# copies drifted apart, each missing a protection another had.
#
# Runs on every PR, scanning ONLY the diff (the full PR range, three-dot). The
# full-tree audit is a separate lane (sanitization-scheduled.yml).
#
# The reusable workflow runs, as separate steps so a red check names its cause:
# the gate self-tests, a config check, the deterministic secrets/PII layer
# (always, including fork PRs), and the semantic particulars layer with
# --require-semantic (fails closed on a missing or broken OPENROUTER_API_KEY).
# Fork PRs get no secrets, so they get the deterministic layer plus a loud
# "partial coverage" warning: a maintainer reviews particulars by hand. Making
# the semantic layer run on forks needs pull_request_target, which is a
# deliberate maintainer decision and intentionally NOT made here.
#
# Pinned to a release tag, never @main. Bump this pin and GATE_TAG in
# scripts/check_sanitization.py together (tests/test_sanitization_pin.py).

on:
  pull_request:

permissions:
  contents: read

jobs:
  sanitize:
    # The pinned tag MUST exist in cyborg-garden/swarm-map. If it does not, this
    # job fails at 0s with no check shown on the PR, which can look green. Keep
    # this repo's sanitization check REQUIRED on main so that case blocks merges.
    uses: cyborg-garden/swarm-map/.github/workflows/sanitization-gate.yml@sanitization-gate-v1.0.0
    with:
      mode: pr
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
